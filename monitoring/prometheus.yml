global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    project: aqi-predictor

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: aqi-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5000"]
        labels:
          service: aqi-predictor

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
